# https://docs.github.com/en/actions

name: "Integrate"

on: # yamllint disable-line rule:truthy
  pull_request: null
  push:
    branches:
      - "main"

permissions: {}

jobs:
  coding-standards:
    name: "Coding Standards"

    permissions:
      contents: "read"

    runs-on: "ubuntu-26.04"

    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Lint YAML files"
        uses: "ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c" # v3.1.1
        with:
          config_file: ".yamllint.yaml"
          file_or_dir: "."
          strict: true

  documentation:
    name: "Documentation"

    permissions:
      contents: "read"

    runs-on: "ubuntu-26.04"

    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          extensions: "none"
          php-version: "8.5"

      - name: "Generate documentation"
        run: "php bin/generate-documentation.php"

      - name: "Check if documentation is up-to-date"
        run: "git diff --exit-code -- README.md"

  github-actions-analysis:
    name: "GitHub Actions Analysis"

    permissions:
      contents: "read"

    runs-on: "ubuntu-26.04"

    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Run zizmorcore/zizmor-action"
        uses: "zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd" # v0.8.1
        with:
          advanced-security: false
          annotations: true
          inputs: ".github/ actions/"
