# https://docs.github.com/en/actions/creating-actions/creating-a-composite-action
# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#inputs
# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#runs-for-composite-run-steps-actions
# https://ohdear.app/docs/api/checks

name: "Request a check run"

description: "Request a check run"

inputs:
  oh-dear-api-token:
    description: "Oh Dear API token of a user with permission to request a check run"
    required: true
  oh-dear-check-id:
    description: "Check identifier of an Oh Dear check for which to request a run"
    required: true

runs:
  using: "composite"

  steps:
    # A run request that Oh Dear rate-limits is tolerated: it accepts one per
    # check every 60 minutes, so deployments that follow each other closely are
    # declined, and the run that has been accepted covers them as well.
    - name: "Request a check run on ohdear.app"
      env:
        OH_DEAR_API_TOKEN: "${{ inputs.oh-dear-api-token }}"
        OH_DEAR_OPERATION: "Requesting a check run"
        OH_DEAR_TOLERATE_RATE_LIMIT: "true"
        OH_DEAR_URL: "https://ohdear.app/api/checks/${{ inputs.oh-dear-check-id }}/request-run"
      run: "${{ github.action_path }}/../../request.sh"
      shell: "bash"
